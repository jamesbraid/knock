name: ci
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: { go-version: "1.22" }
      - run: go vet ./...
      - run: go test -race ./...

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm test

  gitleaks:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'podman-general' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The binary, not gitleaks-action: the action demands a GITLEAKS_LICENSE
      # for organisation-owned repositories, so it fails on the forge, where
      # this repo belongs to infra. It passes on the mirror only because
      # jamesbraid is a user account. Same call as the monorepo's publish gate.
      - name: Scan for secrets
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
